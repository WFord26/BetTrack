openapi: 3.1.0
info:
  title: BetTrack Dashboard REST API
  description: |
    Internal REST API for the BetTrack sports betting dashboard backend.

    ## Authentication

    The API supports two modes controlled by the `AUTH_MODE` environment variable:

    - **`none`** (default) — All routes accessible without login. Admin routes still require a valid admin session.
    - **`oauth2`** — Session-based OAuth2 authentication via Google or Microsoft (Azure AD).

    MCP integration routes and AI bet creation use API key Bearer tokens prefixed with `sk_`.

    ## Base URL

    Default: `http://localhost:3001`

    All API routes are prefixed with `/api`.
  version: 0.3.6
  contact:
    url: https://github.com/WFord26/BetTrack
  license:
    name: MIT

servers:
  - url: http://localhost:3001
    description: Local development
  - url: https://{domain}
    description: Production
    variables:
      domain:
        default: yourdomain.com
        description: Your production domain

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Auth
    description: OAuth2 authentication flow and session management
  - name: Games
    description: Browse upcoming and live games with odds
  - name: Bets
    description: Create, track, and settle bets
  - name: Futures
    description: Futures and outright market listings
  - name: Stats
    description: Game, team, and player statistics
  - name: CLV Analytics
    description: Closing Line Value analysis and reporting
  - name: API Keys
    description: Generate and manage API keys for MCP integration
  - name: Admin
    description: Administrative operations (requires admin session)
  - name: MCP Integration
    description: Optimized routes for MCP Server integration (requires API key)
  - name: AI Bets
    description: AI-assisted bet creation (requires API key)
  - name: Bookmaker Disagreement
    description: |
      Detect bookmaker consensus divergence across h2h, spreads, and totals markets.
      High disagreement scores indicate market inefficiency and potential value opportunities.
      All endpoints require session auth.
  - name: Line Movement Analytics
    description: |
      Detect and analyze betting line movements across bookmakers — steam moves (rapid
      coordinated shifts), gradual drift, and reverse line movement.
      All endpoints require session auth.
  - name: Bookmaker Performance Analytics
    description: |
      Pre-computed per-bookmaker analytics: sharp ratings, value frequency, market
      efficiency, line movement behaviour, coverage, and recommendation scores.
      Metrics are refreshed nightly by the bookmaker-analytics job (02:00 UTC).
      All endpoints require session auth.
  - name: Arbitrage Detection
    description: |
      Arbitrage opportunities (guaranteed profit by covering every side across
      different bookmakers) and middles (a gap between two lines where both legs
      can win).

      Freshness: opportunities are computed from the `CurrentOdds` snapshot, which
      refreshes on the odds sync cadence (~10 minutes by default). Every
      opportunity carries `oddsSnapshotAge` in seconds, measured from the oldest
      leg. See docs/internal/adr-019-arbitrage-sync-cadence.md.

      All endpoints require session auth.

components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: bettrack_session
      description: Session cookie established after OAuth2 login. Not required when AUTH_MODE=none.
    apiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: sk_<key>
      description: API key with `sk_` prefix. Generate via POST /api/keys.

  schemas:
    ArbitrageLeg:
      type: object
      properties:
        side:
          type: string
          enum: [home, away, over, under, draw]
        label:
          type: string
          description: Human readable selection, including the line where relevant
          example: Lakers -3.5
        bookmaker:
          type: string
          example: draftkings
        odds:
          type: integer
          description: American odds
          example: 120
        line:
          type: number
          nullable: true
          description: Spread or total line. Null for moneyline.
        stake:
          type: number
          format: float
          description: Stake for this leg under the optimal split
        toWin:
          type: number
          format: float
          description: Total returned if this leg wins, including stake

    ArbitrageOpportunity:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        detectedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        arbType:
          type: string
          enum: [two-way, three-way, middle]
        marketType:
          type: string
          enum: [h2h, spreads, totals]
        profitPercentage:
          type: number
          description: Guaranteed profit for an arbitrage, expected return for a middle
        stake:
          type: number
        expectedProfit:
          type: number
        legs:
          type: array
          items:
            $ref: '#/components/schemas/ArbitrageLeg'
        middleProbability:
          type: number
          nullable: true
          description: Modelled probability the result lands inside the middle window
        middleGapLow:
          type: number
          nullable: true
        middleGapHigh:
          type: number
          nullable: true
        riskLevel:
          type: string
          enum: [low, medium, high]
        riskFactors:
          type: array
          items:
            type: string
        limitRisk:
          type: boolean
          description: Placing this is likely to attract bookmaker account restrictions
        oddsDrift:
          type: number
          nullable: true
          description: Percentage change in implied probability over the last 30 minutes
        oddsSnapshotAge:
          type: integer
          description: Seconds since the oldest leg in this opportunity was synced
        status:
          type: string
          enum: [active, expired, taken]
        takenAt:
          type: string
          format: date-time
          nullable: true
        actualProfit:
          type: number
          nullable: true
        game:
          type: object
          nullable: true

    ArbitrageStakePlan:
      type: object
      properties:
        odds:
          type: array
          items:
            type: integer
        totalStake:
          type: number
        stakes:
          type: array
          items:
            type: number
        payouts:
          type: array
          items:
            type: number
        totalImpliedProbability:
          type: number
          description: Sum of implied probabilities. Below 1.0 means arbitrage.
        guaranteedProfit:
          type: number
          description: Worst case profit across legs, after cent rounding
        profitPercentage:
          type: number
        isArbitrage:
          type: boolean

    ArbitrageStats:
      type: object
      properties:
        periodDays:
          type: integer
        totalDetected:
          type: integer
        activeNow:
          type: integer
        detectionsPerDay:
          type: number
        averageProfitPercentage:
          type: number
        bestProfitPercentage:
          type: number
        averageSnapshotAgeSeconds:
          type: integer
        taken:
          type: object
          properties:
            count:
              type: integer
            expectedProfit:
              type: number
            actualProfit:
              type: number
        byType:
          type: object
          additionalProperties:
            type: object
        byStatus:
          type: object
          additionalProperties:
            type: integer

    BookmakerAnalytics:
      type: object
      description: Pre-computed analytics row for one bookmaker (refreshed nightly).
      properties:
        id:
          type: string
          format: uuid
        bookmaker:
          type: string
          example: draftkings
        sharpBookRating:
          type: integer
          minimum: 1
          maximum: 10
          description: Overall sharpness score 1–10 based on first-mover and best-odds frequency.
        firstMoverFrequency:
          type: number
          format: float
          description: Percentage of movement events where this book moved first.
        bestOddsFrequency:
          type: number
          format: float
          description: Percentage of eligible markets where this book offered the best odds.
        outlierFrequency:
          type: number
          format: float
          description: Percentage of consensus snapshots where this book was flagged as an outlier.
        marginVsConsensus:
          type: number
          format: float
          description: Average absolute deviation from the consensus line.
        marketEfficiency:
          type: number
          format: float
          description: 0–100 efficiency score derived from margin and outlier frequency.
        lineMovementLag:
          type: integer
          description: Average seconds this book takes to follow a steam move.
        oddsUpdateFrequency:
          type: integer
          description: Average seconds between consecutive odds snapshots.
        averageOddsAge:
          type: integer
          description: Age (in seconds) of the most recent snapshot at time of calculation.
        limitProfile:
          type: string
          enum: [low, medium, high]
          description: Estimated bet limit tier based on sharpness rating.
        estimatedMaxBet:
          type: integer
          description: Rough maximum bet estimate in USD.
        totalGamesOffered:
          type: integer
        totalMarketsOffered:
          type: integer
        sportsCovered:
          type: array
          items:
            type: string
          example: [basketball_nba, americanfootball_nfl]
        marketsCovered:
          type: array
          items:
            type: string
          example: [h2h, spreads, totals]
        averageCLVOffered:
          type: number
          format: float
          nullable: true
          description: Average CLV delivered to bettors placing at this book. Null until BetLeg.bookmaker is populated.
        uptimePercentage:
          type: number
          format: float
          nullable: true
          description: Estimated uptime %. Null until uptime data source is available.
        recommendationScore:
          type: integer
          nullable: true
          description: Composite recommendation score 1–100. Null if insufficient data.
        calculatedAt:
          type: string
          format: date-time
          description: When these metrics were last computed.
        updatedAt:
          type: string
          format: date-time

    SuccessEnvelope:
      type: object
      properties:
        status:
          type: string
          enum: [success]
        data:
          description: Response payload (schema varies by endpoint)

    ErrorEnvelope:
      type: object
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          example: Route not found
        error:
          type: string
          description: Technical error detail (may be omitted in production)

    BetType:
      type: string
      enum: [single, parlay, teaser]
      description: Type of bet. A single has one leg; a parlay combines multiple legs; a teaser adjusts spread/total lines by a fixed number of points.

    BetStatus:
      type: string
      enum: [pending, won, lost, push]

    SelectionType:
      type: string
      enum: [moneyline, spread, total]

    Selection:
      type: string
      enum: [home, away, over, under]

    BetLeg:
      type: object
      required: [gameId, selectionType, selection, odds]
      properties:
        gameId:
          type: string
          format: uuid
        selectionType:
          $ref: '#/components/schemas/SelectionType'
        selection:
          $ref: '#/components/schemas/Selection'
        teamName:
          type: string
          nullable: true
        line:
          type: number
          nullable: true
          description: Point spread or total line value
        odds:
          type: integer
          description: American odds (e.g. -110, +150)
        userAdjustedLine:
          type: number
          nullable: true
        userAdjustedOdds:
          type: integer
          nullable: true

    FutureLeg:
      type: object
      required: [futureId, outcome, odds]
      properties:
        futureId:
          type: string
          format: uuid
        outcome:
          type: string
          description: The futures outcome label (e.g. "Kansas City Chiefs")
        odds:
          type: integer
          description: American odds
        userAdjustedOdds:
          type: integer
          nullable: true

    Bet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        betType:
          $ref: '#/components/schemas/BetType'
        stake:
          type: number
          format: decimal
        potentialPayout:
          type: number
          format: decimal
          nullable: true
        actualPayout:
          type: number
          format: decimal
          nullable: true
        status:
          $ref: '#/components/schemas/BetStatus'
        oddsAtPlacement:
          type: integer
          nullable: true
          description: Composite American odds at bet placement
        teaserPoints:
          type: number
          nullable: true
        notes:
          type: string
          nullable: true
        placedAt:
          type: string
          format: date-time
        settledAt:
          type: string
          format: date-time
          nullable: true
        legs:
          type: array
          items:
            $ref: '#/components/schemas/BetLeg'

    BetStats:
      type: object
      properties:
        totalBets:
          type: integer
        wonBets:
          type: integer
        lostBets:
          type: integer
        pushBets:
          type: integer
        pendingBets:
          type: integer
        winRate:
          type: number
          description: Win rate as a percentage (0-100)
        totalStaked:
          type: number
        totalPayout:
          type: number
        netProfit:
          type: number
        roi:
          type: number
          description: Return on investment as a percentage
        byBetType:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              won:
                type: integer
              netProfit:
                type: number
        bySport:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              won:
                type: integer
              netProfit:
                type: number

    Game:
      type: object
      properties:
        id:
          type: string
          format: uuid
        externalId:
          type: string
        sportKey:
          type: string
          example: americanfootball_nfl
        sportName:
          type: string
          example: NFL
        homeTeamName:
          type: string
        awayTeamName:
          type: string
        commenceTime:
          type: string
          format: date-time
        venue:
          type: string
          nullable: true
        weather:
          type: string
          nullable: true
        status:
          type: string
          enum: [scheduled, in_progress, final, postponed]
        homeScore:
          type: integer
          nullable: true
        awayScore:
          type: integer
          nullable: true
        period:
          type: string
          nullable: true
        clock:
          type: string
          nullable: true
        bookmakers:
          type: array
          description: Grouped odds by bookmaker
          items:
            type: object
            properties:
              key:
                type: string
              title:
                type: string
              markets:
                type: array
                items:
                  type: object

    Future:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Super Bowl LX Winner
        status:
          type: string
          enum: [active, settled]
        sport:
          type: object
          properties:
            key:
              type: string
            name:
              type: string
        groupedOutcomes:
          type: array
          items:
            type: object
            properties:
              outcome:
                type: string
              bookmakers:
                type: array
                items:
                  type: object
                  properties:
                    bookmaker:
                      type: string
                    price:
                      type: integer
              bestOdds:
                type: integer

    ApiKey:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        keyPrefix:
          type: string
          example: sk_abc123...
        permissions:
          type: object
          properties:
            read:
              type: boolean
            write:
              type: boolean
            bets:
              type: boolean
            stats:
              type: boolean
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revoked:
          type: boolean
        createdAt:
          type: string
          format: date-time

    LineMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
        gameId:
          type: string
          format: uuid
        marketType:
          type: string
          enum: [h2h, spreads, totals]
        movementType:
          type: string
          enum: [steam, reverse, gradual, injury, normal]
        bookmakerCount:
          type: integer
          description: Number of bookmakers that moved in the dominant direction
        averageMovement:
          type: number
          description: Average line change across coordinated bookmakers
        maxMovement:
          type: number
          nullable: true
          description: Largest single-bookmaker move in the window
        timeToMove:
          type: integer
          description: Elapsed seconds between the compared sync batches
        suspectedCause:
          type: string
          nullable: true
          description: Human-readable reason (e.g. "Rapid line movement across multiple bookmakers")
        linesBefore:
          type: object
          description: Per-bookmaker snapshot before the move (keys are bookmaker names)
        linesAfter:
          type: object
          description: Per-bookmaker snapshot after the move
        detectedAt:
          type: string
          format: date-time

    MovementStats:
      type: object
      properties:
        byType:
          type: object
          properties:
            steam:
              type: integer
            reverse:
              type: integer
            gradual:
              type: integer
            injury:
              type: integer
            normal:
              type: integer
        byMarket:
          type: object
          properties:
            h2h:
              type: integer
            spreads:
              type: integer
            totals:
              type: integer
        totalMovements:
          type: integer
        steamMovesCount:
          type: integer
        period:
          type: string
          example: Last 24 hours

    ConsensusResult:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        marketType:
          type: string
          enum: [h2h, spreads, totals]
        consensusLine:
          type: number
          description: Median consensus line (American odds for h2h, points for spreads/totals)
        standardDeviation:
          type: number
          description: Std dev in percentage points (h2h) or points (spreads/totals)
        outlierBookmakers:
          type: array
          items:
            type: object
            properties:
              bookmaker:
                type: string
              line:
                type: number
              deviation:
                type: number
                description: Standard deviations from consensus (negative = below)
        bookmakerCount:
          type: integer
        disagreementScore:
          type: integer
          minimum: 0
          maximum: 100
          description: |
            Coefficient of variation × 1000, capped at 100.
            0–30 normal, 31–60 medium, 61–80 high, 81–100 extreme.
        bestValue:
          type: object
          properties:
            side:
              type: string
              enum: [home, away, over, under]
            bookmaker:
              type: string
            line:
              type: number
            impliedProb:
              type: number

    HighDisagreementGame:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        homeTeamName:
          type: string
        awayTeamName:
          type: string
        commenceTime:
          type: string
          format: date-time
        sportKey:
          type: string
        consensus:
          type: array
          items:
            $ref: '#/components/schemas/ConsensusResult'
        maxDisagreementScore:
          type: integer

    CLVReport:
      type: object
      properties:
        summary:
          type: object
          properties:
            totalBets:
              type: integer
            betsWithCLV:
              type: integer
            averageCLV:
              type: number
            positiveCLVBets:
              type: integer
            negativeCLVBets:
              type: integer
        topBets:
          type: array
          items:
            type: object
        worstBets:
          type: array
          items:
            type: object
        bySport:
          type: object
          additionalProperties:
            type: object
        byBookmaker:
          type: object
          additionalProperties:
            type: object

paths:
  # ============================================================
  # HEALTH
  # ============================================================
  /health:
    get:
      tags: [Health]
      summary: Service health check
      description: Returns 200 with service status. No authentication required.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  service:
                    type: string
                    example: sports-betting-dashboard
                  timestamp:
                    type: string
                    format: date-time

  # ============================================================
  # AUTH
  # ============================================================
  /api/auth/status:
    get:
      tags: [Auth]
      summary: Get authentication status and available providers
      responses:
        '200':
          description: Auth status
          content:
            application/json:
              schema:
                type: object
                properties:
                  authEnabled:
                    type: boolean
                  authMode:
                    type: string
                    enum: [none, oauth2]
                  user:
                    nullable: true
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      isAdmin:
                        type: boolean
                  providers:
                    type: array
                    items:
                      type: string
                    example: [google, microsoft]

  /api/auth/google:
    get:
      tags: [Auth]
      summary: Initiate Google OAuth2 flow
      description: Redirects to Google authorization page. Requires `AUTH_MODE=oauth2` and Google credentials configured.
      parameters:
        - name: redirectTo
          in: query
          description: Path to redirect to after successful login
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to Google authorization URL
        '404':
          description: Google auth not configured

  /api/auth/google/callback:
    get:
      tags: [Auth]
      summary: Google OAuth2 callback
      description: Handled internally by BetTrack after Google redirects back. Sets session cookie on success.
      responses:
        '302':
          description: Redirect to frontend (success or error path)

  /api/auth/microsoft:
    get:
      tags: [Auth]
      summary: Initiate Microsoft OAuth2 flow
      description: Redirects to Microsoft authorization page. Requires `AUTH_MODE=oauth2` and Azure AD credentials configured.
      parameters:
        - name: redirectTo
          in: query
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to Microsoft authorization URL
        '404':
          description: Microsoft auth not configured

  /api/auth/microsoft/callback:
    get:
      tags: [Auth]
      summary: Microsoft OAuth2 callback
      responses:
        '302':
          description: Redirect to frontend (success or error path)

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Log out current user
      description: Destroys the current session. Returns 200 even if auth is disabled.
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current authenticated user
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    nullable: true
                  authEnabled:
                    type: boolean
        '401':
          description: Not authenticated

  # ============================================================
  # GAMES
  # ============================================================
  /api/games:
    get:
      tags: [Games]
      summary: List games with filters
      description: Returns games and their current odds. Supports timezone-aware date filtering.
      security:
        - sessionAuth: []
      parameters:
        - name: date
          in: query
          description: Filter by user's local date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2026-01-09"
        - name: sport
          in: query
          description: Sport key filter (e.g. `americanfootball_nfl`). Use `all` for all sports.
          schema:
            type: string
        - name: status
          in: query
          description: Game status filter
          schema:
            type: string
            enum: [scheduled, in_progress, final]
        - name: timezoneOffset
          in: query
          description: Client timezone offset in minutes (from `Date.getTimezoneOffset()`)
          schema:
            type: integer
            example: 420
        - name: bookmaker
          in: query
          description: Filter odds by specific bookmaker key
          schema:
            type: string
      responses:
        '200':
          description: List of games with odds
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  data:
                    type: object
                    properties:
                      games:
                        type: array
                        items:
                          $ref: '#/components/schemas/Game'
                      count:
                        type: integer

  /api/games/{id}:
    get:
      tags: [Games]
      summary: Get a single game with full odds detail
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Game with full odds data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          description: Game not found

  /api/games/{id}/odds:
    get:
      tags: [Games]
      summary: Get current odds for a game
      security:
        - sessionAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: bookmaker
          in: query
          schema:
            type: string
        - name: marketType
          in: query
          description: Filter by market type
          schema:
            type: string
            enum: [h2h, spreads, totals]
      responses:
        '200':
          description: Current odds for the game

  /api/games/{id}/odds/history:
