name: On-Demand Release

# Thin wrapper over scripts/release.mjs. The script owns preflight, version
# bumping, release-note aggregation, the root CHANGELOG.md, the commit, and the
# tag; this workflow supplies credentials and publishes the artifacts the script
# says a given scope needs.

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'What to release'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - mcp
          - dashboard
          - backend
          - frontend
      version_bump:
        description: 'Override the level (blank = infer from each CHANGELOG)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - patch
          - minor
          - major
      dry_run:
        description: 'Plan only — write nothing, publish nothing'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release (${{ inputs.scope }})
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      artifacts: ${{ steps.release.outputs.artifacts }}

    steps:
      - name: Guard — must run on main
        run: |
          if [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "❌ Aborted: releases run from main. Current ref: ${{ github.ref }}"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@wford26'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: mcp/requirements.txt

      - name: Install dashboard dependencies
        working-directory: ./dashboard
        run: npm ci

      - name: Install Python dependencies
        working-directory: ./mcp
        run: pip install -r requirements.txt

      # -----------------------------------------------------------------------
      # Plan — resolve versions, tag, and artifact list before touching anything
      # -----------------------------------------------------------------------
      - name: Resolve release plan
        id: plan
        run: |
          BUMP_ARG=""
          [[ -n "${{ inputs.version_bump }}" ]] && BUMP_ARG="--bump ${{ inputs.version_bump }}"
          node scripts/release.mjs "${{ inputs.scope }}" $BUMP_ARG --json | tee release-plan.json
          {
            echo "tag=$(jq -r .tag release-plan.json)"
            echo "artifacts=$(jq -r '.artifacts | join(",")' release-plan.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize plan
        run: |
          {
            echo "### Release plan"
            echo
            echo "- **Scope:** ${{ inputs.scope }}"
            echo "- **Tag:** ${{ steps.plan.outputs.tag }}"
            echo "- **Artifacts:** ${{ steps.plan.outputs.artifacts }}"
            echo
            jq -r '.packages[] | "- `\(.key)`: \(.currentVersion) → \(.nextVersion) (\(.level))"' release-plan.json
          } >> "$GITHUB_STEP_SUMMARY"

      # -----------------------------------------------------------------------
      # Tests — fail before anything is published or tagged
      # -----------------------------------------------------------------------
      - name: Run release and bump script tests
        run: node --test scripts/*.test.mjs

      - name: Deploy test database
        if: contains(steps.plan.outputs.artifacts, 'backend')
        working-directory: ./dashboard
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
        run: |
          npm run prisma:deploy --workspace=backend
          npm run prisma:generate --workspace=backend

      - name: Run backend tests
        if: contains(steps.plan.outputs.artifacts, 'backend')
        working-directory: ./dashboard
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          NODE_ENV: test
          ODDS_API_KEY: test-key
          JWT_SECRET: test-secret
          SESSION_SECRET: test-session-secret
        run: npm run test:ci --workspace=backend

      - name: Run frontend tests
        if: contains(steps.plan.outputs.artifacts, 'frontend')
        working-directory: ./dashboard
        run: npm run test:ci --workspace=frontend

      - name: Validate MCP server starts
        if: contains(steps.plan.outputs.artifacts, 'mcpb')
        working-directory: ./mcp
        env:
          ODDS_API_KEY: test-key
        # `timeout 10s …` exits 124 when it kills a still-running process.
        # Treat 124 and 0 as success; anything else is a real startup failure.
        shell: bash
        run: |
          set +e
          timeout 10s python sports_mcp_server.py
          code=$?
          set -e
          if [[ $code -ne 124 && $code -ne 0 ]]; then
            echo "MCP server exited with $code"
            exit $code
          fi

      # -----------------------------------------------------------------------
      # Release — bump, changelog, commit, tag, push (the script does all of it)
      # -----------------------------------------------------------------------
      - name: Stop here on a dry run
        if: inputs.dry_run
        run: |
          node scripts/release.mjs "${{ inputs.scope }}" --dry-run --skip-preflight
          echo "✅ Dry run complete — nothing written, nothing published."

      - name: Cut the release
        id: release
        if: '!inputs.dry_run'
        run: |
          BUMP_ARG=""
          [[ -n "${{ inputs.version_bump }}" ]] && BUMP_ARG="--bump ${{ inputs.version_bump }}"
          node scripts/release.mjs "${{ inputs.scope }}" $BUMP_ARG --ci

      # -----------------------------------------------------------------------
      # Build — only what this scope actually needs
      # -----------------------------------------------------------------------
      - name: Build backend
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''npm-backend'')'
        working-directory: ./dashboard
        run: npm run build:backend

      - name: Build frontend
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''npm-frontend'')'
        working-directory: ./dashboard
        run: npm run build:frontend

      - name: Build MCPB package
        id: mcpb
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''mcpb'')'
        run: |
          MCP_VERSION="${{ steps.release.outputs.version_mcp }}"
          BUILD_DIR="mcp/build/sports-data-mcp"
          mkdir -p "$BUILD_DIR" mcp/releases

          for f in sports_mcp_server.py dashboard_mcp_server.py manifest.json \
                    requirements.txt mcpb_bootstrap.py setup.py .env.example \
                    INSTALL_INSTRUCTIONS.md; do
            [[ -f "mcp/$f" ]] && cp "mcp/$f" "$BUILD_DIR/"
          done

          cp -r mcp/sports_api "$BUILD_DIR/"
          find "$BUILD_DIR" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

          MCPB_PATH="mcp/releases/sports-data-mcp-v${MCP_VERSION}.mcpb"
          (cd "$BUILD_DIR" && zip -r "../../../${MCPB_PATH}" . -x "*.pyc")
          echo "path=${MCPB_PATH}" >> "$GITHUB_OUTPUT"

      - name: Create distribution ZIPs
        id: zips
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''zip-'')'
        run: |
          mkdir -p dashboard/dist mcp/releases
          FILES=""

          if [[ "${{ contains(steps.release.outputs.artifacts, 'zip-backend') }}" == "true" ]]; then
            mkdir -p dashboard/dist/backend
            cp -r dashboard/backend/dist/.  dashboard/dist/backend/
            cp    dashboard/backend/package.json dashboard/dist/backend/
            cp    dashboard/backend/.env.example dashboard/dist/backend/ 2>/dev/null || true
            cp -r dashboard/backend/prisma  dashboard/dist/backend/
            ZIP="mcp/releases/backend.v${{ steps.release.outputs.version_dashboard_backend }}.zip"
            (cd dashboard/dist && zip -rq "../../${ZIP}" backend/)
            FILES="${FILES}${ZIP}"$'\n'
          fi

          if [[ "${{ contains(steps.release.outputs.artifacts, 'zip-frontend') }}" == "true" ]]; then
            mkdir -p dashboard/dist/frontend
            cp -r dashboard/frontend/dist/. dashboard/dist/frontend/
            ZIP="mcp/releases/frontend.v${{ steps.release.outputs.version_dashboard_frontend }}.zip"
            (cd dashboard/dist && zip -rq "../../${ZIP}" frontend/)
            FILES="${FILES}${ZIP}"$'\n'
          fi

          {
            echo "files<<ZIP_FILES_EOF"
            printf '%s' "$FILES"
            echo "ZIP_FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # Publish — npm
      # -----------------------------------------------------------------------
      - name: Publish backend to GitHub Packages
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''npm-backend'')'
        working-directory: ./dashboard/backend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --access public --dry-run
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" --registry https://npm.pkg.github.com version 2>/dev/null | grep -q "${PKG_VERSION}"; then
            echo "ℹ️ ${PKG_NAME}@${PKG_VERSION} already published — skipping"
          else
            npm publish --access public
          fi

      - name: Publish frontend to GitHub Packages
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''npm-frontend'')'
        working-directory: ./dashboard/frontend
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm publish --access public --dry-run
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "${PKG_NAME}@${PKG_VERSION}" --registry https://npm.pkg.github.com version 2>/dev/null | grep -q "${PKG_VERSION}"; then
            echo "ℹ️ ${PKG_NAME}@${PKG_VERSION} already published — skipping"
          else
            npm publish --access public
          fi

      # -----------------------------------------------------------------------
      # Publish — Docker
      # -----------------------------------------------------------------------
      - name: Set lowercase registry owner
        id: registry
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-'')'
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-'')'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-'')'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-backend'')'
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/bettrack/backend:${{ steps.release.outputs.release_tag }}
            ghcr.io/${{ steps.registry.outputs.owner }}/bettrack/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        if: '!inputs.dry_run && contains(steps.release.outputs.artifacts, ''docker-frontend'')'
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          file: ./dashboard/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.registry.outputs.owner }}/bettrack/frontend:${{ steps.release.outputs.release_tag }}
            ghcr.io/${{ steps.registry.outputs.owner }}/bettrack/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # -----------------------------------------------------------------------
      # GitHub Release — notes come straight from the script
      # -----------------------------------------------------------------------
      - name: Create GitHub Release
        id: gh_release
        if: '!inputs.dry_run'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: Release ${{ steps.release.outputs.release_tag }}
          body: ${{ steps.release.outputs.release_notes }}
          files: |
            ${{ steps.mcpb.outputs.path }}
            ${{ steps.zips.outputs.files }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false

      - name: Summary
        if: '!inputs.dry_run'
        run: |
          {
            echo "### Released ${{ steps.release.outputs.release_tag }}"
            echo
            echo "- **Artifacts:** ${{ steps.release.outputs.artifacts }}"
            echo "- **GitHub Release:** ${{ steps.gh_release.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
