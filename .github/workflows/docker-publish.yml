name: Docker Publish

on:
  push:
    branches:
      - main
    paths:
      - 'dashboard/backend/**'
      - 'dashboard/frontend/**'
      - 'dashboard/backend/Dockerfile'
      - 'dashboard/frontend/Dockerfile'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read backend version
        id: backend-ver
        run: echo "version=$(node -p "require('./dashboard/backend/package.json').version")" >> $GITHUB_OUTPUT

      - name: Read frontend version
        id: frontend-ver
        run: echo "version=$(node -p "require('./dashboard/frontend/package.json').version")" >> $GITHUB_OUTPUT

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bettrack/backend
          tags: |
            type=raw,value=${{ steps.backend-ver.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.backend-ver.outputs.version }}
            org.opencontainers.image.title=BetTrack Backend

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bettrack/frontend
          tags: |
            type=raw,value=${{ steps.frontend-ver.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.frontend-ver.outputs.version }}
            org.opencontainers.image.title=BetTrack Frontend

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          file: ./dashboard/frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
